name: CI

on:
  pull_request:
    # base 브랜치 제한 없이 스택 PR도 검사한다. edited는 아래에서 base 변경만 허용한다.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # 제목·본문 수정이 진행 중인 코드 검사를 취소하지 않도록 그룹을 구분한다.
  group: >-
    ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-${{
      (github.event.action != 'edited' || github.event.changes.base.ref != null)
      && 'checks' || 'metadata'
    }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    # skipped 결과가 기존 필수 검사의 실패를 덮지 않도록 표시 이름도 구분한다.
    name: >-
      ${{ (github.event.action != 'edited' || github.event.changes.base.ref != null)
        && 'Lint and build' || 'PR metadata (CI skipped)' }}
    if: >-
      github.event.action != 'edited' || github.event.changes.base.ref != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint, formatting, and types
        run: pnpm check

      - name: Build
        run: pnpm build
