name: Deploy Production (Vercel)

on:
  push:
    branches: [dev]

permissions:
  contents: read

# 이미 진행 중인 Production 배포가 끝난 뒤 다음 배포를 실행한다.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      HUSKY: "0"
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!secret_name}" ]]; then
              printf '::error::Required secret is missing: %s\n' "$secret_name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint, formatting, and types
        run: pnpm check

      - name: Install Vercel CLI
        run: npm install --global vercel@62.1.0

      - name: Pull Production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Production artifacts
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Summarize deployment
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const env = process.env;
          const status = env.DEPLOYMENT_STATUS;
          const labels = { success: "성공", failure: "실패", cancelled: "취소" };
          const result = labels[status] ?? status;
          const repositoryUrl = `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}`;
          const runUrl = `${repositoryUrl}/actions/runs/${env.GITHUB_RUN_ID}/attempts/${env.GITHUB_RUN_ATTEMPT}`;
          const commitUrl = `${repositoryUrl}/commit/${env.GITHUB_SHA}`;
          const shortSha = env.GITHUB_SHA.slice(0, 7);
          const title = `한마음 FE Production 배포 ${result}`;

          appendFileSync(env.GITHUB_STEP_SUMMARY, [
            `## ${title}`,
            "",
            `- 브랜치: ${env.GITHUB_REF_NAME}`,
            `- 커밋: [${shortSha}](${commitUrl})`,
            `- 실행 로그: [GitHub Actions](${runUrl})`,
            env.DEPLOYMENT_URL ? `- 배포 주소: ${env.DEPLOYMENT_URL}` : "- 배포 주소: 생성되지 않음",
            "",
          ].join("\n"));

          NODE
